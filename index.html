<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز الصمود الاستراتيجي | Executive War Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;600;700&display=swap');
        :root { --executive-green: #064e3b; --saudi-emerald: #10b981; --charcoal-bg: #0f172a; }
        body { font-family: 'Noto Sans Arabic', sans-serif; background-color: var(--charcoal-bg); color: #f8fafc; scroll-behavior: smooth; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .animate-marquee { display: flex; animation: marquee 30s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
    </style>
</head>
<body class="min-h-screen pb-20 overflow-x-hidden">

    <!-- شريط الاستخبارات (Live Ticker) -->
    <div class="bg-emerald-950/80 border-b border-emerald-500/20 py-2 overflow-hidden">
        <div class="animate-marquee flex items-center gap-8 text-[10px] font-bold text-emerald-400 whitespace-nowrap">
            <span class="flex items-center gap-2"><i class="fas fa-circle text-[6px] pulse"></i> حالة الملاحة: مضيق هرمز - نشط (42 ناقلة)</span>
            <span class="flex items-center gap-2"><i class="fas fa-circle text-[6px] pulse text-yellow-500"></i> البحر الأحمر: حذر لوجستي</span>
            <span class="flex items-center gap-2"><i class="fas fa-chart-line"></i> برنت: $84.20 (+1.2%)</span>
            <span class="flex items-center gap-2"><i class="fas fa-microchip"></i> توطين التقنية: 68.4%</span>
        </div>
    </div>

    <nav class="border-b border-emerald-900/50 bg-slate-900/95 backdrop-blur-md sticky top-0 z-50 px-4 py-3">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center">
                    <i class="fas fa-shield-halved text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white leading-tight">مركز الصمود الاستراتيجي</h1>
                    <p class="text-[9px] text-emerald-400 uppercase tracking-widest font-black">Executive War Room v4.0</p>
                </div>
            </div>
            <button onclick="window.print()" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold">
                <i class="fas fa-file-pdf"></i> تقرير تنفيذي
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 mt-8 space-y-12">
        
        <!-- غرفة العمليات (War Room) -->
        <section class="glass-card p-6 rounded-3xl border-r-4 border-blue-500">
            <h2 class="text-xl font-bold text-white mb-6 flex items-center gap-2">
                <i class="fas fa-users-gear text-blue-500"></i> غرفة العمليات الاستراتيجية
            </h2>
            <div id="war-room-log" class="bg-slate-900/50 p-4 rounded-xl h-48 overflow-y-auto text-[10px] space-y-2">
                <p class="text-slate-500 italic">نظام محاكاة القرارات التنفيذية جاهز...</p>
            </div>
            <button onclick="startWarRoom()" class="mt-4 bg-blue-600 px-6 py-2 rounded-xl text-sm font-bold text-white">إطلاق الجلسة</button>
        </section>

        <!-- لوحة محاكاة الرؤية -->
        <section class="glass-card p-6 rounded-3xl border-t-4 border-emerald-500">
            <h2 class="text-xl font-bold text-white mb-6">لوحة محاكاة برامج رؤية 2030</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="space-y-4">
                    <label class="block text-emerald-400 text-xs font-bold">البرنامج المستهدف</label>
                    <select class="w-full bg-slate-800 border-none rounded-xl p-3 text-white text-sm">
                        <option>برنامج تطوير الصناعة (ندلب)</option>
                        <option>صندوق الاستثمارات العامة</option>
                        <option>برنامج التحول الوطني</option>
                    </select>
                </div>
                <div class="space-y-4">
                    <label class="block text-emerald-400 text-xs font-bold">نسبة التحوط الرأسمالي</label>
                    <input type="range" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>
        </section>

        <!-- منشئ الأزمات -->
        <section class="glass-card p-6 rounded-3xl border-r-4 border-yellow-500">
            <h3 class="text-lg font-bold text-white mb-4">منشئ الأزمات المخصص</h3>
            <div class="flex gap-4">
                <input id="crisis-input" type="text" placeholder="أدخل اسم الأزمة..." class="flex-1 bg-slate-800 border-none rounded-xl p-3 text-white text-sm">
                <button onclick="addCrisis()" class="bg-yellow-600 px-6 py-2 rounded-xl text-sm font-bold text-slate-900">حقن الأزمة</button>
            </div>
        </section>
    </main>

    <script>
        function startWarRoom() {
            const log = document.getElementById('war-room-log');
            log.innerHTML = "<p class='text-blue-400 font-bold'>[!] تم بدء الجلسة الطارئة</p>";
            const actions = ["CEO: مراجعة خطة الطوارئ", "CFO: تحويل ميزانية CapEx", "COO: تفعيل سلاسل الإمداد البديلة"];
            let i = 0;
            const timer = setInterval(() => {
                if (i >= actions.length) return clearInterval(timer);
                log.innerHTML += `<p class='border-b border-white/5 pb-1'><span class='text-slate-500'>[${new Date().toLocaleTimeString()}]</span> ${actions[i]}</p>`;
                i++;
            }, 1500);
        }
    </script>
</body>
</html>
